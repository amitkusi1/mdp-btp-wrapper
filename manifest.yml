applications:
  - name: mdp-btp-wrapper
    path: target/mdp-btp-wrapper-0.0.1-SNAPSHOT.jar
    random-route: true
    memory: 1024M
    instances: 1
    buildpacks:
      - sap_java_buildpack_jakarta
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      JBP_CONFIG_COMPONENTS: '{ jres: ["com.sap.xs.java.buildpack.jre.SAPMachineJRE"] }'
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
      DESTINATION_NAME: S4_S4H_100_KNX_ODATA
      JWT_ISSUER_URI: ((jwt-issuer-uri))
      JWT_JWK_SET_URI: ((jwt-jwk-set-uri))
      JWT_AUDIENCE: urn:mdp:btp-wrapper
    services:
      - dest-a3k
      - mdp-wrapper-connectivity
      - mdp-wrapper-xsuaa