server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: mdp-btp-wrapper
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}
          audiences:
            - ${JWT_AUDIENCE:urn:mdp:btp-wrapper}

wrapper:
  destination-name: ${DESTINATION_NAME:S4_S4H_100_KNX_ODATA}
  service-path: ${S4_SERVICE_PATH:/sap/opu/odata/sap/ZUI_KX_ODATA_OP_V2}